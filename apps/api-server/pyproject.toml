[project]
name = "whipai-api-server"
version = "0.1.0"
description = "WhipAI backend API server — modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.138.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]==0.49.0",
    "sqlmodel==0.0.38",
]

[project.optional-dependencies]
dev = ["httpx"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
