[project]
name = "whipdahermes-machine-agent"
version = "0.1.0"
description = "WhipAI machine agent heartbeat client and scheduler"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
