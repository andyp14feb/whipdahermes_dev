services:
  api-server:
    build:
      context: ./apps/api-server
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: sqlite:////data/hcp.db
      STALE_TIMEOUT_SECONDS: 60
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  web-dashboard:
    build:
      context: ./apps/web-dashboard
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://api-server:8000
    depends_on:
      api-server:
        condition: service_healthy

  machine-agent:
    build:
      context: ./apps/machine-agent
    init: true
    restart: unless-stopped
    environment:
      MACHINE_ID: ${MACHINE_ID:-${HOSTNAME:-machine-agent}}
      API_URL: http://api-server:8000
      INTERVAL: 2
      COMMAND_POLL_INTERVAL: 5
      TMUX_SOCKET: ${TMUX_SOCKET:-/host-tmux/default}
      SESSION_BACKENDS: ${SESSION_BACKENDS:-tmux}
    volumes:
      - ${TMUX_HOST_DIR:-/tmp/tmux-1000}:/host-tmux
    depends_on:
      api-server:
        condition: service_healthy
